<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hima Ground Station</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313202b'/%3E%3Cpath d='M6 21c4-6 8-9 10-9s6 3 10 9' stroke='%23c9711f' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='3' fill='%23c9711f'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem("hima.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1f3343"/>
        <path d="M5 22c4-6.5 8-9.5 11-9.5s7 3 11 9.5" stroke="#c9711f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="16" cy="12.5" r="3.2" fill="#c9711f"/><path d="M9 25h14" stroke="#6f8aa0" stroke-width="2" stroke-linecap="round"/></svg>
      <div><b>HIMA</b><small>Ground station</small></div>
    </div>
    <nav id="nav">
      <a href="#/overview" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="lbl">Overview</span></a>
      <a href="#/mission" data-page="mission"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg><span class="lbl">Mission</span></a>
      <a href="#/compare" data-page="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="lbl">Compare</span></a>
      <a href="#/review" data-page="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h4v4H8z"/><path d="M15 10h3M15 14h3"/></svg><span class="lbl">Review</span></a>
      <a href="#/route" data-page="route"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg><span class="lbl">Route</span><span class="badge" id="routeBadge" hidden>new</span></a>
    </nav>
    <div class="side-sec">
      <div class="side-row"><span class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">Live</span></span><span id="missionCount"></span></div>
      <label class="side-row" title="Virtual flights: the simulator's flight and synthetic flights, never real ones. Counted in totals only while no real flight has arrived, unless you switch this on.">
        <span>Count virtual flights</span><span class="switch"><input type="checkbox" id="virtualToggle"><span></span></span></label>
      <div class="side-row"><span>Theme</span><div class="seg-theme" id="themeSeg"><button data-t="system">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div></div>
      <div class="arch" id="archPath"></div>
    </div>
  </aside>
  <main><div id="view"><div class="skel-page"><div class="skel a"></div><div class="skel b"></div><div class="skel c"></div></div></div></main>
</div>
<div id="tip"></div>
<div id="toasts"></div>
<script src="/static/core.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/pages.js"></script>
<script src="/static/route.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
